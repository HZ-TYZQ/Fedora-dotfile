# 覆盖 /usr/share/xdg-desktop-portal/niri-portals.conf（用户级，仅对 niri 会话生效）
# FileChooser 改走 KDE 后端：xdg-desktop-portal-gnome 50 起把文件选择器委托给
# org.gnome.Nautilus，本机未安装 Nautilus 导致 QQ/OBS 等应用的文件对话框完全无反应。
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=kde;
