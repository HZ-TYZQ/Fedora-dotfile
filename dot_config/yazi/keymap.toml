# smart-enter：目录 → 进入；文件 → 按 [open] 规则用默认应用打开
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Right>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# clipboard.yazi：yank/cut 同步到系统剪贴板；<C-p> 从系统剪贴板粘贴文件
[[mgr.prepend_keymap]]
on   = "y"
run  = [ "yank", "plugin clipboard -- --action=copy" ]
desc = "Yank selected files (copy)"

[[mgr.prepend_keymap]]
on   = "x"
run  = [ "yank --cut", "plugin clipboard -- --action=copy" ]
desc = "Yank selected files (cut)"

[[mgr.prepend_keymap]]
on   = "<C-p>"
run  = "plugin clipboard -- --action=paste"
desc = "Paste files from system clipboard"
